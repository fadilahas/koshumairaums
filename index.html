<meta name="theme-color" content="#0F766E">

<style>

--k-pes:#FEF3C7;--k-pes-l:#FCD34D;--k-pes-t:#78350F;--k-pes-d:#D97706;
--k-fix:#EEF2F6;--k-fix-l:#CBD5E1;--k-fix-t:#334155;--k-fix-d:#64748B}
[data-mode=dark]{--bg:#0D1217;--sf:#151C23;--sf2:#1A222B;--sf3:#212B35;--ln:#27323D;--ln2:#36434F;--tx:#E7EDF3;--tx2:#B8C4CF;--mu:#8B9AA9;
--ok:#4ADE80;--okb:rgba(34,197,94,.14);--warn:#FBBF24;--warnb:rgba(245,158,11,.14);--bad:#F87171;--badb:rgba(239,68,68,.15);--info:#93C5FD;--infob:rgba(59,130,246,.15);
--s1:#3987e5;--s2:#d95926;--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 18px 50px rgba(0,0,0,.55);
--k-isi:rgba(59,130,246,.17);--k-isi-l:rgba(96,165,250,.45);--k-isi-t:#BFDBFE;--k-isi-d:#60A5FA;
--k-kos:rgba(34,197,94,.15);--k-kos-l:rgba(74,222,128,.42);--k-kos-t:#BBF7D0;--k-kos-d:#4ADE80;
--k-pes:rgba(245,158,11,.15);--k-pes-l:rgba(251,191,36,.45);--k-pes-t:#FDE68A;--k-pes-d:#FBBF24;
--k-fix:rgba(148,163,184,.12);--k-fix-l:rgba(148,163,184,.38);--k-fix-t:#CBD5E1;--k-fix-d:#94A3B8}
[data-theme=toska]{--ac:#0F766E;--ac2:#115E59;--acs:#E3F4F2;--onac:#fff}
[data-mode=dark][data-theme=toska]{--ac:#2DD4BF;--ac2:#5EEAD4;--acs:rgba(45,212,191,.13);--onac:#032B28}
[data-theme=biru]{--ac:#1D4ED8;--ac2:#1E40AF;--acs:#E8EEFD;--onac:#fff}
[data-mode=dark][data-theme=biru]{--ac:#60A5FA;--ac2:#93C5FD;--acs:rgba(96,165,250,.14);--onac:#0B1B3F}
[data-theme=hijau]{--ac:#15803D;--ac2:#166534;--acs:#E5F4EA;--onac:#fff}
[data-mode=dark][data-theme=hijau]{--ac:#4ADE80;--ac2:#86EFAC;--acs:rgba(74,222,128,.13);--onac:#05290F}
[data-theme=ungu]{--ac:#6D28D9;--ac2:#5B21B6;--acs:#F0EAFD;--onac:#fff}
[data-mode=dark][data-theme=ungu]{--ac:#A78BFA;--ac2:#C4B5FD;--acs:rgba(167,139,250,.15);--onac:#1E0B45}
[data-theme=marun]{--ac:#9F1239;--ac2:#881337;--acs:#FBE9EE;--onac:#fff}
[data-mode=dark][data-theme=marun]{--ac:#FB7185;--ac2:#FDA4AF;--acs:rgba(251,113,133,.14);--onac:#3B0614}
[data-theme=kopi]{--ac:#8B5A2B;--ac2:#6F4520;--acs:#F5EDE4;--onac:#fff}
[data-mode=dark][data-theme=kopi]{--ac:#D6A26B;--ac2:#E7C097;--acs:rgba(214,162,107,.15);--onac:#2A1806}
[data-theme=grafit]{--ac:#334155;--ac2:#1E293B;--acs:#EBEFF3;--onac:#fff}
[data-mode=dark][data-theme=grafit]{--ac:#CBD5E1;--ac2:#E2E8F0;--acs:rgba(203,213,225,.12);--onac:#0F172A}
[data-theme=senja]{--ac:#C2410C;--ac2:#9A3412;--acs:#FDEEE6;--onac:#fff}
[data-mode=dark][data-theme=senja]{--ac:#FB923C;--ac2:#FDBA74;--acs:rgba(251,146,60,.14);--onac:#2E1003}
html{font-size:14px;-webkit-text-size-adjust:100%}
html[data-fs=l]{font-size:16px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--ff);background:var(--bg);color:var(--tx);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--ac)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i.s{width:16px;height:16px}svg.i.l{width:26px;height:26px}
.app{display:flex;min-height:100vh}
.side{display:none}
.mw{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}
.top .brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.top .brand b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand small{display:block;font-size:.72rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ac);color:var(--onac);display:grid;place-items:center;flex:none;overflow:hidden;font-weight:800}
.logo img{width:100%;height:100%;object-fit:cover}
.psel{max-width:150px;min-height:36px;padding:6px 28px 6px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf2);font-size:.85rem;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ib{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;color:var(--tx2);flex:none;position:relative}
.ib:hover{background:var(--sf3)}
.ib .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--sf)}
main{width:100%;max-width:1200px;margin:0 auto;padding:12px 12px 92px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:.7rem;color:var(--mu);font-weight:600;position:relative}
.bnav button.on{color:var(--ac)}
.bnav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.bnav .dot{position:absolute;top:8px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
@media(min-width:860px){
.side{display:flex;flex-direction:column;width:228px;flex:none;position:sticky;top:0;height:100vh;background:var(--sf);border-right:1px solid var(--ln);padding:14px 10px;overflow-y:auto}
.side .sb{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--ln);margin-bottom:10px}
.side .sb b{display:block;font-size:1.05rem;line-height:1.2}.side .sb small{color:var(--mu);font-size:.75rem;display:block;line-height:1.3;word-break:break-word}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;color:var(--tx2);font-weight:600;font-size:.93rem;text-align:left;position:relative}
.side nav button:hover{background:var(--sf3)}
.side nav button.on{background:var(--acs);color:var(--ac)}
.side nav .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:auto}
.side .sf{margin-top:auto;padding:10px 8px 0;font-size:.75rem;color:var(--mu)}
.bnav{display:none}.top .brand .logo,.top .mbtn{display:none}
main{padding:18px 22px 40px}}
.demo{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:6px 10px;background:#111827;color:#F9FAFB;font-size:.8rem;text-align:center}
.demo a{background:#FDE047;color:#111827;font-weight:800;padding:4px 12px;border-radius:999px;text-decoration:none;white-space:nowrap}
.warnbar{padding:8px 12px;background:var(--warnb);color:var(--warn);font-size:.82rem;border-bottom:1px solid var(--ln);display:flex;gap:8px;align-items:flex-start}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.ph h2{font-size:1.3rem;line-height:1.25;letter-spacing:-.2px}
.ph p{color:var(--mu);font-size:.86rem}
.ph .acts{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh);min-width:0}
.card h3{font-size:1rem;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.card h3 .x{font-size:.8rem;font-weight:500;color:var(--mu)}
.g2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:980px){.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.g2.eq{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1180px){.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px;box-shadow:var(--sh);min-width:0;text-align:left;display:block;width:100%}
button.kpi:hover{border-color:var(--ac)}
.kpi .l{font-size:.78rem;color:var(--mu);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:1.3rem;font-weight:750;letter-spacing:-.3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.76rem;color:var(--mu);margin-top:1px;line-height:1.35}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.meter{height:8px;border-radius:99px;background:var(--acs);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ac);border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;font-weight:650;font-size:.9rem;border:1px solid var(--ln2);background:var(--sf);color:var(--tx);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sf3)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.btn.p:hover{background:var(--ac2);border-color:var(--ac2)}
.btn.d{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.dl{color:var(--bad);border-color:var(--ln2)}
.btn.wa{background:#1FAF54;border-color:#1FAF54;color:#fff}
.btn.wa:hover{background:#17924A}
.btn.gh{border-color:transparent;background:transparent;color:var(--ac)}
.btn.gh:hover{background:var(--acs)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn.bl{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.ib:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:1px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap;line-height:1.5;background:var(--sf3);color:var(--tx2)}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.warn{background:var(--warnb);color:var(--warn)}.chip.info{background:var(--infob);color:var(--info)}.chip.ac{background:var(--acs);color:var(--ac)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:.74rem;background:var(--sf3);color:var(--tx2);margin:2px 3px 2px 0}
.mu{color:var(--mu)}.sm{font-size:.82rem}.xs{font-size:.74rem}.b{font-weight:700}.r{text-align:right}.nw{white-space:nowrap}.num{font-variant-numeric:tabular-nums}
.okt{color:var(--ok)}.badt{color:var(--bad)}.warnt{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}.row.w{flex-wrap:wrap}.row.sb{justify-content:space-between}.grow{flex:1;min-width:0}
.mt{margin-top:10px}.mb{margin-bottom:10px}.mt2{margin-top:16px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tb .srch{flex:1 1 200px;min-width:0;position:relative}
.tb .srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mu)}
.tb .srch input{padding-left:36px}
.tb select{flex:1 1 150px;width:auto;max-width:100%;min-width:0}
.tb label.f{flex:0 1 auto}
.seg{display:inline-flex;background:var(--sf3);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:6px 11px;border-radius:8px;font-size:.84rem;font-weight:650;color:var(--tx2);white-space:nowrap}
.seg button.on{background:var(--sf);color:var(--ac);box-shadow:var(--sh)}
.seg button .n{font-size:.72rem;color:var(--mu);margin-left:3px}
label.f{display:block;min-width:0}
label.f>span{display:block;font-size:.8rem;font-weight:650;color:var(--tx2);margin-bottom:4px}
label.f>span i{font-style:normal;font-weight:400;color:var(--mu)}
input,select,textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--ln2);border-radius:10px;background:var(--sf);color:var(--tx);font-size:16px}
@media(min-width:860px){input,select,textarea{font-size:.95rem}}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--ac);flex:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
input.inv,select.inv,textarea.inv{border-color:var(--bad);box-shadow:0 0 0 3px var(--badb)}
.ferr{color:var(--bad);font-size:.78rem;margin-top:3px;font-weight:600}
.hint{font-size:.76rem;color:var(--mu);margin-top:3px}
.fg{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:520px){.fg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.fg .s2{grid-column:span 2}}
.fg.c2m{grid-template-columns:repeat(2,minmax(0,1fr))}
.ck{display:flex;align-items:flex-start;gap:8px;font-size:.9rem;cursor:pointer;padding:4px 0}
.ck input{margin-top:2px}
.sect{font-size:.78rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--ln)}
.fac{display:flex;flex-wrap:wrap;gap:6px}
.fac label{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--ln2);border-radius:999px;font-size:.84rem;cursor:pointer;user-select:none}
.fac label:has(input:checked){background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:650}
.fac input{width:15px;height:15px}
.list{display:flex;flex-direction:column}
.it{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--ln);min-width:0}
.it:last-child{border-bottom:0}
.it .av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none;background:var(--acs);color:var(--ac)}
.it .av.bad{background:var(--badb);color:var(--bad)}.it .av.warn{background:var(--warnb);color:var(--warn)}.it .av.ok{background:var(--okb);color:var(--ok)}.it .av.info{background:var(--infob);color:var(--info)}
.it .bd{flex:1;min-width:0}
.it .t1,.it .t2{display:block}
.it .t1{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t2{font-size:.8rem;color:var(--mu);line-height:1.35}
.it .rt{text-align:right;flex:none;max-width:48%}
.it .rt .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
button.it{width:100%;text-align:left}
button.it:hover{background:var(--sf2)}
.empty{text-align:center;padding:28px 12px;color:var(--mu)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:6px}
.empty b{display:block;color:var(--tx2);margin-bottom:2px}
.todo .it .av{width:34px;height:34px;border-radius:10px}
.floor{margin-bottom:14px}
.floor h4{font-size:.82rem;color:var(--mu);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.denah{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
@media(max-width:400px){.denah{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;border-radius:12px;padding:8px 9px;min-height:84px;border:1.5px solid;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;transition:transform .12s}
.tile:hover{transform:translateY(-1px)}
.tile .c{font-weight:800;font-size:1.05rem;line-height:1.2}
.tile .n{font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tile .m{font-size:.68rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .fl{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.tile .fl i{width:9px;height:9px;border-radius:50%;display:block;border:2px solid var(--sf)}
.st-terisi{background:var(--k-isi);border-color:var(--k-isi-l);color:var(--k-isi-t)}
.st-kosong{background:var(--k-kos);border-color:var(--k-kos-l);color:var(--k-kos-t)}
.st-dipesan{background:var(--k-pes);border-color:var(--k-pes-l);color:var(--k-pes-t)}
.st-perbaikan{background:repeating-linear-gradient(135deg,var(--k-fix) 0 8px,transparent 8px 14px),var(--k-fix);border-color:var(--k-fix-l);color:var(--k-fix-t)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--tx2);margin:2px 0 10px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1.5px solid}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,15,20,.55);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}

@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.shh{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--ln)}

var DOC_SEWA='# SURAT PERJANJIAN SEWA {jenis_objek}\nNomor: {nomor_dokumen}\n\nPada hari ini, {hari_ini}, bertempat di {kota}, kami yang bertanda tangan di bawah ini:\n\n1. **{pemilik}**, selaku pemilik/pengelola {properti}, beralamat di {alamat_properti}, selanjutnya disebut **PIHAK PERTAMA**.\n2. **{nama}**, {jenis_identitas} No. {no_identitas}, asal {asal}, pekerjaan/instansi {pekerjaan}, No. HP {hp}, selanjutnya disebut **PIHAK KEDUA**.\n\nKedua belah pihak sepakat mengadakan perjanjian sewa-menyewa dengan ketentuan sebagai berikut.\n\n## Pasal 1 — Objek Sewa\nPIHAK PERTAMA menyewakan kepada PIHAK KEDUA {kamar} (lantai {lantai}, tipe {tipe_kamar}, ukuran {ukuran}) di {properti}, dengan fasilitas: {fasilitas}. Daftar inventaris dan kondisinya dicatat dalam Berita Acara Serah Terima yang menjadi bagian tidak terpisahkan dari perjanjian ini. Jumlah penghuni: {jumlah_penghuni} orang.\n\n## Pasal 2 — Jangka Waktu\nSewa dimulai tanggal {tanggal_mulai} dengan periode pembayaran per {periode_sewa}. Masa sewa: {masa_kontrak}.\n\n## Pasal 3 — Harga Sewa dan Pembayaran\n1. Harga sewa sebesar **{harga_sewa}** ({harga_terbilang}) per {periode_sewa}, dibayar di muka paling lambat pada tanggal jatuh tempo, yaitu setiap tanggal {tgl_jatuh_tempo} sesuai periode.\n2. Biaya tambahan rutin: {biaya_tambahan}.\n3. Pembayaran melalui: {rekening}. Setiap pembayaran diberikan kwitansi.\n4. Tidak ada denda, bunga, atau biaya tambahan atas keterlambatan pembayaran. Bila PIHAK KEDUA mengalami kesulitan, para pihak bermusyawarah untuk menyepakati jadwal pembayaran.\n\n## Pasal 4 — Uang Jaminan (Deposit)\n1. PIHAK KEDUA menyerahkan uang jaminan sebesar {deposit} ({deposit_terbilang}). Uang jaminan bukan pembayaran sewa.\n2. Uang jaminan dikembalikan paling lambat {hari_pengembalian_deposit} hari setelah serah terima kamar saat keluar, setelah dikurangi (bila ada) biaya perbaikan kerusakan di luar pemakaian wajar yang disepakati bersama dalam Berita Acara Serah Terima, serta tagihan yang belum dibayar.\n\n## Pasal 5 — Listrik, Air, dan Fasilitas\nListrik: {listrik}. Air: {air}. Pemakaian dicatat dan ditagihkan secara terbuka.\n\n## Pasal 6 — Kewajiban PIHAK KEDUA\n1. Menggunakan kamar sebagai tempat tinggal dan merawatnya dengan baik.\n2. Mematuhi Tata Tertib yang berlaku dan menjaga ketertiban lingkungan.\n3. Menyerahkan salinan identitas untuk pendataan dan pelaporan kepada RT/RW setempat.\n4. Tidak menyewakan kembali atau memindahkan hak sewa kepada pihak lain, serta tidak mengubah bangunan, tanpa izin tertulis PIHAK PERTAMA.\n5. Melaporkan kerusakan sesegera mungkin dan menanggung perbaikan kerusakan yang terjadi karena kelalaiannya.\n\n## Pasal 7 — Kewajiban PIHAK PERTAMA\n1. Menyerahkan kamar dalam keadaan layak huni beserta fasilitasnya.\n2. Memperbaiki kerusakan yang bukan disebabkan oleh PIHAK KEDUA dalam waktu yang wajar.\n3. Menjamin PIHAK KEDUA dapat menempati kamar dengan aman dan tenteram selama masa sewa.\n\n## Pasal 8 — Berakhirnya Sewa\n1. Pihak yang hendak mengakhiri sewa memberitahukan paling lambat {hari_pemberitahuan} hari sebelumnya.\n2. Saat keluar, kamar diserahkan kembali dalam keadaan bersih beserta kunci dan inventaris, dicatat dalam Berita Acara Serah Terima.\n\n## Pasal 9 — Penyelesaian Perselisihan\nPerselisihan diselesaikan secara musyawarah untuk mufakat. Hal-hal yang belum diatur akan disepakati kemudian secara tertulis oleh kedua pihak.\n\nPerjanjian ini dibuat rangkap dua, masing-masing ditandatangani kedua pihak dan mempunyai kekuatan yang sama.';
var DOC_TATIB='# TATA TERTIB PENGHUNI\n{properti} — {alamat_properti}\n\nDemi kenyamanan dan keamanan bersama, setiap penghuni diharapkan mematuhi tata tertib berikut.\n\n## Keamanan dan Pendataan\n1. Setiap penghuni menyerahkan salinan identitas (KTP/KTM/SIM) kepada pengelola untuk pendataan dan pelaporan kepada RT setempat.\n2. Tamu yang menginap wajib seizin pengelola dan dilaporkan kepada RT paling lambat 1×24 jam, mengikuti aturan lingkungan setempat.\n3. Pintu pagar dikunci pukul 22.00. Penghuni yang pulang lebih malam mohon memberi kabar kepada pengelola.\n4. Dilarang membawa atau menyimpan narkoba, minuman keras, senjata tajam, dan bahan mudah meledak, serta dilarang berjudi.\n5. Kunci kamar menjadi tanggung jawab penghuni. Kehilangan kunci mohon segera dilaporkan.\n\n## Tamu\n6. Jam berkunjung tamu pukul 08.00–21.00. Tamu diterima di ruang tamu atau teras.\n\n## Kebersihan dan Fasilitas\n7. Menjaga kebersihan kamar, kamar mandi, dapur, dan area bersama. Sampah dibuang ke tempat yang disediakan.\n8. Hemat listrik dan air: matikan lampu, AC, dan keran saat tidak digunakan.\n9. Tidak menambah peralatan listrik berdaya besar tanpa izin pengelola.\n10. Kerusakan fasilitas segera dilaporkan. Kerusakan karena kelalaian menjadi tanggung jawab penghuni sesuai kesepakatan.\n11. Tidak memaku, mengecat, atau mengubah dinding tanpa izin.\n\n## Ketertiban\n12. Menjaga ketenangan, terutama pukul 22.00–05.00.\n13. Parkir kendaraan dengan rapi di tempat yang disediakan.\n14. Hewan peliharaan hanya dengan izin pengelola.\n\n## Pembayaran dan Keluar\n15. Sewa dibayar di muka paling lambat pada tanggal jatuh tempo masing-masing. Bila ada kendala, mohon segera dikomunikasikan agar dapat dimusyawarahkan.\n16. Penghuni yang akan keluar memberi tahu paling lambat {hari_pemberitahuan} hari sebelumnya dan menyerahkan kamar dalam keadaan bersih.\n\nTerima kasih atas kerja samanya. Mari jaga {properti} tetap nyaman untuk semua.';

function leaseOfUnit(uid){for(var i=0;i<db.leases.length;i++){var l=db.leases[i];if(l.uid===uid&&l.status==='aktif')return l;}return null;}
function leaseOfTenant(tid){for(var i=0;i<db.leases.length;i++){var l=db.leases[i];if(l.tid===tid&&l.status==='aktif')return l;}return null;}
function bookingOfUnit(uid){for(var i=0;i<db.bookings.length;i++){var b=db.bookings[i];if(b.uid===uid&&b.status==='menunggu')return b;}return null;}
function uStatus(u){if(leaseOfUnit(u.id))return 'terisi';if(u.repair)return 'perbaikan';if(bookingOfUnit(u.id))return 'dipesan';return 'kosong';}
var STL={terisi:'Terisi',kosong:'Kosong',dipesan:'Dipesan',perbaikan:'Perbaikan'};
function uMonthly(u){var p=u.price||{};if(+p[1])return +p[1];if(+p[3])return Math.round(p[3]/3);if(+p[6])return Math.round(p[6]/6);if(+p[12])return Math.round(p[12]/12);return 0;}
function uPrice(u,per){var p=u.price||{};return +p[per]||uMonthly(u)*per;}
function vacantSince(u){var last='';db.leases.forEach(function(l){if(l.uid===u.id&&l.status==='selesai'&&l.co&&l.co.date>last)last=l.co.date;});return last||u.vacSince||u.created||db.meta.created||today();}

function bGross(b){return sum(b.items,function(i){return i.a;});}
function bDisc(b){return sum(b.disc||[],function(i){return i.a;});}
function bNet(b){return Math.max(0,bGross(b)-bDisc(b));}
function bPaid(b){return sum(b.pays||[],function(p){return p.a;});}
function bRem(b){return b.void?0:Math.max(0,bNet(b)-bPaid(b));}
function bLate(b,t){return diff(b.due,t||today());}
function bState(b,t){if(b.void)return 'batal';var r=bRem(b);if(r<=0)return 'lunas';if(bLate(b,t)>0)return 'telat';if(bPaid(b)>0)return 'sebagian';return 'belum';}
function bChip(b){var s=bState(b);if(s==='lunas')return '<span class="chip ok">'+ic('check','s')+'Lunas</span>';if(s==='batal')return '<span class="chip">Dibatalkan</span>';if(s==='telat')return '<span class="chip bad">Lewat '+bLate(b)+' hari'+(bPaid(b)>0?' · sebagian':'')+'</span>';if(s==='sebagian')return '<span class="chip warn">Sebagian</span>';var d=-bLate(b);return '<span class="chip '+(d<=db.set.remDays?'info':'')+'">'+(d===0?'Jatuh tempo hari ini':'Jatuh tempo '+relDays(d))+'</span>';}
function openBills(){return db.bills.filter(function(b){return !b.void&&bRem(b)>0;});}
function arrears(pidAll){var t=today();return db.bills.filter(function(b){return !b.void&&bRem(b)>0&&b.due<t&&(pidAll||inP(b));});}
function incFor(b,payDate){var c=db.set.inc;if(!c||!c.on||b.void)return 0;if((b.disc||[]).some(function(d){return d.k==='apresiasi';}))return 0;var lim=addDays(b.due,-(+c.days||0));if((payDate||today())>lim)return 0;var base=sum(b.items.filter(function(i){return i.k==='sewa';}),function(i){return i.a;});if(base<=0)return 0;var v=c.mode==='persen'?Math.round(base*(+c.val||0)/100/100)*100:Math.round(+c.val||0);return Math.max(0,Math.min(v,base,bRem(b)));}
function incText(){var c=db.set.inc;if(!c||!c.on)return '';var v=c.mode==='persen'?(+c.val||0)+'% dari sewa':rp(c.val);return c.days>0?'apresiasi '+v+' bila dibayar paling lambat '+c.days+' hari sebelum jatuh tempo':'apresiasi '+v+' bila dibayar paling lambat pada tanggal jatuh tempo';}

function genList(asOf,lead){var lim=addDays(asOf||today(),lead==null?(+db.set.lead||0):lead),m=hasBillMap(),out=[];
 db.leases.forEach(function(l){if(l.status!=='aktif'||!(+l.period>0)||!okDate(l.start))return;
  for(var k=0;k<1500;k++){var s=cStart(l,k);if(s>lim)break;if(l.endPlan&&s>l.endPlan)break;if(l.billFrom&&s<l.billFrom)continue;if(m[l.id+'|'+s])continue;out.push({l:l,ps:s,pe:addDays(cStart(l,k+1),-1)});}});
 out.sort(function(a,b){return a.ps<b.ps?-1:a.ps>b.ps?1:0;});return out;}
function rateOf(l,k){var p=P(l.pid)||{};return k==='L'?{rate:+p.kwh||0,adm:+p.kwhAdm||0,unit:'kWh'}:{rate:+p.water||0,adm:0,unit:'m³'};}
function utilPending(l,k){var rs=db.readings.filter(function(r){return r.lid===l.id&&r.k===k&&!r.bid&&(+r.use||0)>0;}).sort(byDate);if(!rs.length)return null;var use=Math.round(sum(rs,function(r){return r.use;})*100)/100,rr=rateOf(l,k);return {rs:rs,use:use,r0:rs[0].prev,r1:rs[rs.length-1].val,rate:rr.rate,adm:rr.adm,unit:rr.unit,amount:rnd(use*rr.rate)+rr.adm};}
function rnd(x){var r=+((db&&db.set&&db.set.roundTo)||1);if(!(r>0))r=1;return Math.round(Math.round(x)/r)*r;}
function utilItemName(k,p){return (k==='L'?'Listrik':'Air')+' '+nf(p.r0,2)+' → '+nf(p.r1,2)+' = '+nf(p.use,2)+' '+p.unit+' × '+rpd(p.rate)+(p.adm?' + biaya admin '+rp(p.adm):'');}
function attachUtil(b,l,k){var p=utilPending(l,k);if(!p)return null;var it={k:k==='L'?'listrik':'air',n:utilItemName(k,p),a:p.amount,m:{rids:p.rs.map(function(r){return r.id;}),r0:p.r0,r1:p.r1,use:p.use,rate:p.rate,adm:p.adm}};p.rs.forEach(function(r){r.bid=b.id;});b.items.push(it);return it;}

function makeBill(l,ps,pe,created){var u=U(l.uid)||{code:'?'};var per=+l.period||1;var items=[{k:'sewa',n:'Sewa '+u.code+(per>1?' ('+per+' bulan)':''),a:+l.rent||0}];
 (l.extras||[]).forEach(function(x){if(+x.a>0)items.push({k:'extra',n:x.n+(per>1?' ('+per+' bln × '+rp(x.a)+')':''),a:Math.round(x.a*per)});});
 var b={id:uid('b'),no:nextNo('tg',created||today()),lid:l.id,tid:l.tid,uid:l.uid,pid:l.pid,ps:ps,pe:pe,due:addDays(ps,+db.set.dueOff||0),items:items,disc:[],pays:[],rem:[],promise:null,note:'',created:created||today()};

function remKind(b,t){var d=-bLate(b,t);if(d>0)return 'pengingat';if(d===0)return 'jatuhtempo';return -d>7?'telat2':'telat1';}

function occ(){var us=db.units.filter(inP),o=0,f=0;us.forEach(function(u){var s=uStatus(u);if(s==='terisi')o++;if(s==='perbaikan')f++;});return {n:us.length,o:o,fix:f,pct:us.length?Math.round(o/us.length*100):0};}
function potential(){return sum(db.units.filter(inP),function(u){var l=leaseOfUnit(u.id);return l?Math.round(l.rent/l.period):uMonthly(u);});}
function payIn(month,pidAll){var s=0;db.bills.forEach(function(b){if(b.void&&!b.pays.length)return;if(!pidAll&&!inP(b))return;b.pays.forEach(function(p){if(mk(p.date)===month)s+=+p.a||0;});});return s;}
function payInSplit(month,pid){var r={sewa:0,util:0,lain:0,tot:0};db.bills.forEach(function(b){if(pid&&b.pid!==pid)return;var ps=b.pays.filter(function(p){return mk(p.date)===month;});if(!ps.length)return;var amt=sum(ps,function(p){return p.a;});var g=bGross(b)||1,net=bNet(b)||1;var s=0,u=0,o=0;b.items.forEach(function(i){if(i.k==='sewa')s+=+i.a;else if(i.k==='listrik'||i.k==='air')u+=+i.a;else o+=+i.a;});var dsc=bDisc(b);s=Math.max(0,s-dsc);var tt=s+u+o||1;r.sewa+=amt*s/tt;r.util+=amt*u/tt;r.lain+=amt*o/tt;r.tot+=amt;});r.sewa=Math.round(r.sewa);r.util=Math.round(r.util);r.lain=r.tot-r.sewa-r.util;return r;}
function expIn(month,pid){return sum(db.exps.filter(function(e){return mk(e.date)===month&&(!pid||e.pid===pid);}),function(e){return e.a;});}

function depositCalc(o){var recv=+o.recv||0,ded=sum(o.ded||[],function(d){return d.a;}),util=+o.util||0,arr=o.useArr?(+o.arr||0):0,extra=+o.refundRent||0;var used=Math.min(recv,ded+util+arr);var refund=recv-(ded+util+arr)+extra;return {recv:recv,ded:ded,util:util,arr:arr,extra:extra,total:ded+util+arr,refund:Math.max(0,refund),short:Math.max(0,-(recv-(ded+util+arr))),used:used};}
function endingSoon(days){var t=today(),lim=addDays(t,days||30);return db.leases.filter(function(l){return l.status==='aktif'&&inP(l)&&l.endPlan&&l.endPlan>=t&&l.endPlan<=lim;});}
function maintState(m){if(!m.next)return 'aman';var d=diff(today(),m.next);return d<0?'telat':d<=7?'segera':'aman';}

function aboutHtml(){return '<p class="sm"><b>KosKu v'+VER+'</b> — aplikasi pengelola kos, kontrakan, rumah petak, paviliun & ruko kecil. Berjalan offline sepenuhnya di browser; tidak ada server, tidak ada iklan, dan data tidak dikirim ke mana pun. Tombol WhatsApp hanya membuka aplikasi WhatsApp dengan pesan yang sudah terisi.</p><div class="sect">Prinsip</div><ul class="sm" style="margin-left:18px"><li>Tanpa denda, bunga, atau biaya keterlambatan. Penagihan dengan pengingat sopan, cicilan tanpa tambahan biaya, janji bayar, dan keringanan.</li><li>Apresiasi bayar tepat waktu bersifat sukarela & bisa dimatikan.</li><li>Deposit adalah titipan penghuni: dikembalikan dengan perhitungan terbuka di berita acara.</li></ul><div class="sect">Rujukan (diperiksa Oktober 2026)</div><ul class="xs" style="margin-left:18px;line-height:1.6"><li>Tarif listrik PLN rumah tangga nonsubsidi Triwulan IV 2026 tidak naik: R-1 900 VA RTM Rp 1.352/kWh; R-1 1.300–2.200 VA Rp 1.444,70; R-2/R-3 ≥3.500 VA Rp 1.699,53; subsidi 450 VA Rp 415, 900 VA Rp 605 (pemberitaan Fortune IDN 1 Okt 2026, Journal Arta 13 Okt 2026; dasar Permen ESDM 28/2016 jo. 8/2023). Tarif ditinjau tiap 3 bulan — atur sendiri di Properti.</li><li>Lapor tamu/pendatang 1×24 jam ke RT diatur di tingkat daerah (mis. Pergub DKI 22/2022 Pasal 13; Perwali Surabaya 30/2025), bukan aturan nasional yang seragam; pendataan penduduk nonpermanen: Permendagri 14/2015 (Hukumonline, “Aturan tentang Tamu 1x24 Jam Wajib Lapor”).</li><li>Sewa-menyewa: KUHPerdata Pasal 1548–1600 (kewajiban pemilik & penyewa), asas kebebasan berkontrak Pasal 1338; PP 44/1994 tentang Penghunian Rumah oleh Bukan Pemilik (perjanjian tertulis; larangan menyewakan kembali tanpa izin tertulis).</li><li>Pajak: PPh final 10% atas sewa tanah/bangunan (PP 34/2017) berlaku untuk rumah kontrakan; rumah kos dikategorikan jasa penginapan sehingga dikecualikan dari PPh final 10% namun tetap objek PPh usaha (DDTCNews 17 Agu 2026; MetroTV 2026). Kos tidak lagi disebut sebagai objek PBJT jasa perhotelan di UU 1/2022 (HKPD), tetapi cek perda setempat.</li><li>Potongan pelunasan: Fatwa DSN-MUI No. 46/DSN-MUI/II/2005 (potongan boleh diberikan, tidak diperjanjikan dalam akad).</li></ul><p class="xs mu mt">Informasi di atas bersifat umum dan bukan nasihat hukum/pajak. Aturan dapat berubah; periksa ketentuan terbaru dan peraturan daerah setempat.</p>';}
